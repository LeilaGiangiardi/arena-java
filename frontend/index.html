<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Java - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <!-- Fundo Synthwave -->
    <div class="grid-background"></div>

    <!-- Tela Principal Limpa (Splash Screen) -->
    <main class="hero-container">
        <h1 class="hero-title">System.out.play("<span class="highlight-cyan">Arena Java</span>");</h1>
        <p class="hero-subtitle">Fuja do título de Criador de Bugs, ganhe XP e prove que você é o <br>Compilador Humano
            de BSI 🧠.</p>

        <button id="btn-run" class="btn-run pulse-animation">▶ Run (Shift + F10)</button>
    </main>

    <!-- Modal Flutuante de Login / Cadastro -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="btn-close" class="btn-close"><i class="ph ph-x"></i></button>

            <!-- Abas -->
            <div class="modal-tabs">
                <button id="tab-login" class="tab-btn active">Login</button>
                <button id="tab-cadastro" class="tab-btn">Cadastro</button>
            </div>

            <!-- Único formulário inteligente (Comunica com a AuthServlet) -->
            <form id="auth-form" class="auth-form">
                <div id="nome-group" class="input-group hidden">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Ex: Ana Silva">
                </div>

                <div class="input-group">
                    <label>E-mail </label>
                    <input type="email" id="email" placeholder="aluno@ufrpe.br" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>

                <p id="error-msg" class="text-red hidden" style="margin-bottom: 15px; font-weight: bold;"></p>

                <button type="submit" id="btn-submit" class="btn-submit">ENTRAR</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
